[package]
name = "nexus"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Nexus AI Workspace CLI"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
color-eyre = "0.6"
reqwest = { version = "0.12", features = ["json"] }
